/office4_drive/controller_server:
  ros__parameters:
    controller_frequency: 8.0
    odom_topic: /office4_drive/base_odom
    failure_tolerance: 0.0
    min_x_velocity_threshold: 0.002
    min_y_velocity_threshold: 0.002
    min_theta_velocity_threshold: 0.003
    progress_checker_plugin: progress_checker
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.07
      movement_time_allowance: 5.0
    goal_checker_plugins: [goal_checker]
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.13
      yaw_goal_tolerance: 0.22
      stateful: true
    controller_plugins: [FollowPath]
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: 0.0
      max_vel_x: 0.08
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_speed_xy: 0.08
      min_speed_xy: 0.0
      max_vel_theta: 0.20
      min_speed_theta: 0.0
      acc_lim_x: 0.24
      decel_lim_x: -0.24
      acc_lim_theta: 0.45
      decel_lim_theta: -0.45
      vx_samples: 8
      vy_samples: 1
      vtheta_samples: 14
      sim_time: 2.0
      linear_granularity: 0.025
      angular_granularity: 0.035
      transform_tolerance: 0.35
      trans_stopped_velocity: 0.018
      xy_goal_tolerance: 0.13
      critics: [RotateToGoal, Oscillation, BaseObstacle, ObstacleFootprint, PathAlign, GoalAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.02
      ObstacleFootprint.scale: 0.02
      PathAlign.scale: 25.0
      GoalAlign.scale: 16.0
      PathDist.scale: 22.0
      GoalDist.scale: 24.0
      PathAlign.forward_point_distance: 0.15
      GoalAlign.forward_point_distance: 0.15
      RotateToGoal.scale: 22.0
/office4_drive/local_costmap/local_costmap:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    rolling_window: true
    width: 6
    height: 6
    resolution: 0.05
    update_frequency: 6.0
    publish_frequency: 2.0
    always_send_full_costmap: true
    transform_tolerance: 0.5
    track_unknown_space: true
    footprint: '[[0.315,0.225],[0.315,-0.225],[-0.315,-0.225],[-0.315,0.225]]'
    footprint_padding: 0.02
    plugins: [walls, live, inflation]
    walls:
      plugin: nav2_costmap_2d::StaticLayer
      map_topic: /navigation_preview/map
      map_subscribe_transient_local: true
    live:
      plugin: nav2_costmap_2d::ObstacleLayer
      observation_sources: scan
      scan:
        topic: /office4_live/scan
        data_type: LaserScan
        marking: true
        clearing: true
        expected_update_rate: 0.9
        obstacle_max_range: 3.8
        raytrace_max_range: 4.2
        min_obstacle_height: -2.0
        max_obstacle_height: 2.0
    inflation:
      plugin: nav2_costmap_2d::InflationLayer
      inflation_radius: 0.36
      cost_scaling_factor: 4.0
/office4_drive/collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: lidar
    base_shift_correction: false
    cmd_vel_in_topic: /office4_drive/tracking_velocity
    cmd_vel_out_topic: /office4_drive/checked_velocity
    source_timeout: 0.6
    transform_tolerance: 0.1
    polygons: [front_stop]
    front_stop:
      type: polygon
      action_type: stop
      points: [0.275, 0.36, 0.85, 0.36, 0.85, -0.36, 0.275, -0.36]
      max_points: 2
      visualize: false
    observation_sources: [near_scan]
    near_scan:
      type: scan
      topic: /office4_drive/near_scan
