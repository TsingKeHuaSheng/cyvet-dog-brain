# Planning preview: measured 0.63 x 0.45 m, modeled as centered, plus 0.02 m padding.
# Not a measured swept-foot or asymmetric payload model. No locomotion output.
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.1
      allow_unknown: true
      motion_model_for_search: REEDS_SHEPP
      minimum_turning_radius: 0.4
      angle_quantization_bins: 72
      max_planning_time: 5.0
      max_iterations: 200000
      max_on_approach_iterations: 1000
      smooth_path: true
      analytic_expansion_max_length: 3.0
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      rolling_window: false
      track_unknown_space: true
      footprint_padding: 0.02
      plugins:
      - static_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /navigation_preview/map
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.32
        cost_scaling_factor: 4.0
      always_send_full_costmap: true
      footprint: '[[0.315,0.225],[0.315,-0.225],[-0.315,-0.225],[-0.315,0.225]]'
